[project]
name = "rev-depth-networks"
version = "0.1.0"
description = "dependencies for BNN and GCNet"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "albumentations>=2.0.8", # original: 1.3.1
    "dataclasses-json>=0.6.7",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.1",
    "natsort>=8.4.0",
    "pingouin>=0.6.1",
    "scikit-image>=0.26.0",
    "scikit-learn-intelex>=2026.1.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "torch>=2.13.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", extra = "gpu" }]
torchvision = [{ index = "pytorch-cu132", extra = "gpu" }]
    
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[project.optional-dependencies]
gpu = [
    "torch>=2.13.0",
    "torchvision>=0.29.0"
]
